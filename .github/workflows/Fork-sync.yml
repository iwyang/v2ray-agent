name: Fork-sync

permissions:
  contents: write
  actions: write   # 清理历史运行记录需要

on:
  schedule:
    - cron: "0 19 * * *"  # 每天 UTC 19:00 = 北京时间次日凌晨 3 点
  workflow_dispatch:       # 支持手动触发，用于立即测试

jobs:
  sync_upstream:
    name: Sync from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果上游改动了 .github/workflows，GITHUB_TOKEN 无权推送，
          # 需在仓库 Secrets 中添加 SYNC_TOKEN（带 repo + workflow 权限的 PAT）。
          # 没有配置时自动回退到默认 token。
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream changes
        run: |
          git remote add upstream https://github.com/mack-a/v2ray-agent.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "已是最新，无需同步"
          else
            # 优先快进合并；本地有额外提交时退化为普通合并
            git merge --ff-only upstream/master \
              || git merge upstream/master --no-edit \
              || (echo "合并冲突，需手动处理" && exit 1)
          fi

      - name: Push to origin
        run: |
          git push origin master

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        timeout-minutes: 10
        continue-on-error: true    # 清理失败不影响同步结果
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 5
          delete_workflow_pattern: Fork-sync
